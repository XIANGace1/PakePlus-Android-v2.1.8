<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>习惯打卡 · 灵动动画</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 12px 0 30px 0;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 32px 32px 0 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            padding: 20px 18px 30px 18px;
            margin: 0 10px;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #1e293b;
            letter-spacing: -0.3px;
        }

        .subhead {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 22px;
            font-weight: 400;
            border-left: 4px solid #3b82f6;
            padding-left: 12px;
        }

        /* 添加习惯 */
        .add-habit-section {
            display: flex;
            gap: 10px;
            margin-bottom: 28px;
        }

        .add-habit-section input {
            flex: 1;
            border: 1.5px solid #e2e8f0;
            border-radius: 30px;
            padding: 14px 18px;
            font-size: 16px;
            background: #f8fafc;
            transition: 0.2s;
            outline: none;
        }

        .add-habit-section input:focus {
            border-color: #3b82f6;
            background: white;
        }

        .add-habit-section button {
            background: #3b82f6;
            border: none;
            border-radius: 40px;
            width: 60px;
            color: white;
            font-size: 28px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(59,130,246,0.25);
            transition: 0.15s;
        }

        .add-habit-section button:active {
            background: #2563eb;
            transform: scale(0.95);
        }

        /* 习惯卡片——入场动画 */
        @keyframes cardAppear {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .habit-card {
            background: white;
            border-radius: 24px;
            padding: 18px 16px 16px 16px;
            margin-bottom: 16px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.03), 0 0 0 1px rgba(0,0,0,0.02);
            border: 1px solid #f1f5f9;
            transition: box-shadow 0.2s, transform 0.15s;
            animation: cardAppear 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
            transform-origin: top center;
        }

        .habit-card:hover {
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        /* 删除淡出动画 */
        .habit-card.remove-animation {
            animation: cardDisappear 0.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            pointer-events: none;
        }

        @keyframes cardDisappear {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.8); margin-bottom: -70px; }
        }

        .habit-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .habit-name {
            font-size: 20px;
            font-weight: 600;
            color: #0f172a;
            max-width: 170px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .habit-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            font-size: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            color: #334155;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }

        .icon-btn:active {
            background: #e2e8f0;
            transform: scale(0.9);
        }

        .stats-row {
            display: flex;
            gap: 20px;
            margin-bottom: 18px;
            background: #f8fafc;
            padding: 12px 14px;
            border-radius: 20px;
        }

        .stat-item {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 12px;
            color: #64748b;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 26px;
            font-weight: 700;
            color: #1e293b;
            line-height: 1.2;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .check-btn {
            flex: 2;
            background: #eef2ff;
            border: none;
            border-radius: 40px;
            padding: 14px 0;
            font-size: 18px;
            font-weight: 600;
            color: #4f46e5;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 2px 4px rgba(79,70,229,0.1);
            cursor: pointer;
            transition: background 0.2s, color 0.2s, transform 0.1s, box-shadow 0.2s;
            border: 1px solid rgba(79,70,229,0.2);
        }

        .check-btn.completed {
            background: #4f46e5;
            color: white;
            border-color: #4f46e5;
            box-shadow: 0 8px 16px rgba(79,70,229,0.25);
        }

        .check-btn:active {
            transform: scale(0.96);
        }

        .heatmap-icon {
            flex: 1;
            background: #f1f5f9;
            border: none;
            border-radius: 40px;
            padding: 12px 0;
            font-size: 20px;
            font-weight: 500;
            color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .heatmap-icon:active {
            background: #e2e8f0;
            transform: scale(0.96);
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
            font-size: 16px;
            background: #f8fafc;
            border-radius: 40px;
        }

        /* 模态框 (热力图 & 确认框) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(4px);
            transition: background-color 0.2s;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 380px;
            border-radius: 36px;
            padding: 24px 20px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            animation: modalSlide 0.25s ease;
        }

        @keyframes modalSlide {
            0% { opacity: 0.7; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .modal-header h3 {
            font-size: 22px;
            font-weight: 600;
            color: #0f172a;
            max-width: 200px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .close-btn {
            background: #f1f5f9;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #475569;
            transition: background 0.15s;
        }

        .close-btn:active {
            background: #e2e8f0;
        }

        /* 确认框专用样式 */
        .confirm-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .confirm-btn {
            flex: 1;
            padding: 16px 0;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 17px;
            cursor: pointer;
            transition: 0.15s;
        }

        .confirm-btn.cancel {
            background: #f1f5f9;
            color: #334155;
        }

        .confirm-btn.confirm {
            background: #4f46e5;
            color: white;
            box-shadow: 0 6px 12px rgba(79,70,229,0.25);
        }

        .confirm-btn:active {
            transform: scale(0.96);
        }

        /* 日历部分 (保留) */
        .month-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 10px 0 16px;
        }

        .month-nav button {
            background: #f1f5f9;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 22px;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            transition: 0.1s;
        }

        .month-nav button:active {
            background: #e2e8f0;
        }

        .month-year {
            font-size: 18px;
            font-weight: 600;
            color: #334155;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
            margin: 18px 0 14px;
        }

        .weekday {
            font-size: 14px;
            font-weight: 500;
            color: #94a3b8;
            padding: 6px 0;
        }

        .cal-cell {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 500;
            background: #f8fafc;
            border-radius: 12px;
            color: #1e293b;
            transition: background 0.15s;
        }

        .cal-cell.completed {
            background: #4f46e5;
            color: white;
            font-weight: 600;
            box-shadow: 0 4px 8px rgba(79,70,229,0.3);
        }

        .cal-cell.empty {
            background: transparent;
            color: transparent;
        }

        .total-stats {
            background: #f1f5f9;
            border-radius: 30px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 16px;
            font-weight: 500;
        }

        /* Toast 通知 */
        .toast-container {
            position: fixed;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            pointer-events: none;
            z-index: 3000;
        }

        .toast {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(8px);
            color: white;
            padding: 14px 24px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 500;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            transform: translateY(30px);
            opacity: 0;
            transition: transform 0.25s ease, opacity 0.2s;
            max-width: 80%;
            text-align: center;
            pointer-events: none;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
<div class="app-container">
    <h1>⏰ 习惯打卡</h1>
    <div class="subhead">轻触打卡 · 灵动动画</div>

    <div class="add-habit-section">
        <input type="text" id="habitNameInput" placeholder="习惯名称, 如: 跑步" autocomplete="off">
        <button id="addHabitBtn">+</button>
    </div>

    <div id="habitList"></div>

    <div class="footnote" style="color:#94a3b8; font-size:13px; text-align:center; margin-top:20px;">
        点击❤️打卡 · 点击📊查看热力图 · 连续中断即重置
    </div>
</div>

<!-- 热力图模态框 -->
<div id="heatmapModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalHabitName">习惯</h3>
            <button class="close-btn" id="closeModalBtn">&times;</button>
        </div>
        <div class="month-nav">
            <button id="prevMonthBtn">←</button>
            <span class="month-year" id="modalMonthYear">2025年3月</span>
            <button id="nextMonthBtn">→</button>
        </div>
        <div class="calendar-grid" id="calendarGrid">
            <div class="weekday">一</div><div class="weekday">二</div><div class="weekday">三</div><div class="weekday">四</div><div class="weekday">五</div><div class="weekday">六</div><div class="weekday">日</div>
        </div>
        <div class="total-stats">
            <span>本月打卡</span>
            <span id="monthCount">0</span>
        </div>
        <div class="total-stats" style="margin-top:8px;">
            <span>总打卡天数</span>
            <span id="totalGlobalCount">0</span>
        </div>
    </div>
</div>

<!-- 自定义确认模态框 (用于删除) -->
<div id="confirmModal" class="modal">
    <div class="modal-content" style="padding: 24px 20px;">
        <div class="modal-header">
            <h3 id="confirmTitle">确认删除</h3>
            <button class="close-btn" id="confirmCloseBtn">&times;</button>
        </div>
        <p id="confirmMessage" style="font-size: 16px; color: #334155; margin: 12px 0 20px;">确定要删除这个习惯吗？</p>
        <div class="confirm-actions">
            <button class="confirm-btn cancel" id="confirmCancelBtn">取消</button>
            <button class="confirm-btn confirm" id="confirmOkBtn">删除</button>
        </div>
    </div>
</div>

<!-- Toast 容器 -->
<div class="toast-container" id="toastContainer">
    <div class="toast" id="toast">提示消息</div>
</div>

<script>
    (function() {
        // ---------- 数据存储 ----------
        const STORAGE_KEY = 'habit_app_data';
        let habits = [];

        // 模态框状态
        let modalCurrentHabitId = null;
        let modalYear = new Date().getFullYear();
        let modalMonth = new Date().getMonth() + 1;

        // 删除待处理的habitId (用于确认后删除)
        let pendingDeleteId = null;
        let pendingDeleteElement = null;

        // ---------- 工具函数 ----------
        function getTodayString() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function formatDate(year, month, day) {
            return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        }

        function getDateStrFromDate(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function calculateStreak(records) {
            let streak = 0;
            let currentDate = new Date();
            for (let i = 0; i < 366; i++) {
                const dateStr = getDateStrFromDate(currentDate);
                if (records[dateStr]) {
                    streak++;
                    currentDate.setDate(currentDate.getDate() - 1);
                } else {
                    break;
                }
            }
            return streak;
        }

        function totalDays(records) {
            return Object.keys(records).length;
        }

        function saveHabits() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
        }

        function loadHabits() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    habits = JSON.parse(stored);
                } catch (e) {
                    habits = [];
                }
            } else {
                const today = getTodayString();
                const yesterday = (() => { let d = new Date(); d.setDate(d.getDate() - 1); return getDateStrFromDate(d); })();
                const twoDaysAgo = (() => { let d = new Date(); d.setDate(d.getDate() - 2); return getDateStrFromDate(d); })();
                const threeDaysAgo = (() => { let d = new Date(); d.setDate(d.getDate() - 3); return getDateStrFromDate(d); })();

                habits = [
                    {
                        id: '1',
                        name: '晨跑',
                        records: {
                            [twoDaysAgo]: true,
                            [yesterday]: true,
                            [today]: true,
                        }
                    },
                    {
                        id: '2',
                        name: '阅读',
                        records: {
                            [threeDaysAgo]: true,
                            [twoDaysAgo]: true,
                            [yesterday]: true,
                        }
                    }
                ];
            }
        }

        // ---------- Toast 高级提示 ----------
        function showToast(message, duration = 2000) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        // ---------- 自定义确认框 (删除确认) ----------
        function showConfirm(message, onConfirm, onCancel) {
            const modal = document.getElementById('confirmModal');
            document.getElementById('confirmMessage').textContent = message;
            modal.classList.add('active');

            const closeHandler = () => {
                modal.classList.remove('active');
                cleanup();
            };

            const cancelHandler = () => {
                modal.classList.remove('active');
                if (onCancel) onCancel();
                cleanup();
            };

            const okHandler = () => {
                modal.classList.remove('active');
                if (onConfirm) onConfirm();
                cleanup();
            };

            const cleanup = () => {
                document.getElementById('confirmCloseBtn').removeEventListener('click', closeHandler);
                document.getElementById('confirmCancelBtn').removeEventListener('click', cancelHandler);
                document.getElementById('confirmOkBtn').removeEventListener('click', okHandler);
            };

            document.getElementById('confirmCloseBtn').addEventListener('click', closeHandler);
            document.getElementById('confirmCancelBtn').addEventListener('click', cancelHandler);
            document.getElementById('confirmOkBtn').addEventListener('click', okHandler);
        }

        // ---------- 渲染习惯列表 (带入场动画) ----------
        function renderHabits() {
            const container = document.getElementById('habitList');
            if (!container) return;

            if (habits.length === 0) {
                container.innerHTML = '<div class="empty-state">✨ 点击上方 + 添加第一个习惯</div>';
                return;
            }

            let html = '';
            habits.forEach(habit => {
                const records = habit.records || {};
                const total = totalDays(records);
                const streak = calculateStreak(records);
                const todayStr = getTodayString();
                const isCompletedToday = !!records[todayStr];

                html += `
                    <div class="habit-card" data-id="${habit.id}">
                        <div class="habit-header">
                            <span class="habit-name" title="${habit.name}">${habit.name}</span>
                            <div class="habit-actions">
                                <button class="icon-btn habit-edit" data-id="${habit.id}" title="编辑习惯名">✏️</button>
                                <button class="icon-btn habit-delete" data-id="${habit.id}" title="删除习惯">🗑️</button>
                            </div>
                        </div>
                        <div class="stats-row">
                            <div class="stat-item">
                                <span class="stat-label">累计</span>
                                <span class="stat-value">${total}</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">连续</span>
                                <span class="stat-value">${streak}</span>
                            </div>
                        </div>
                        <div class="card-footer">
                            <button class="check-btn ${isCompletedToday ? 'completed' : ''}" data-id="${habit.id}" data-action="check">
                                ${isCompletedToday ? '✅ 已完成' : '◉ 打卡'}
                            </button>
                            <button class="heatmap-icon" data-id="${habit.id}" data-action="heatmap">
                                📊 热力图
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ---------- 打卡逻辑 (带toast) ----------
        function toggleHabitCheck(habitId) {
            const habit = habits.find(h => h.id === habitId);
            if (!habit) return;

            const today = getTodayString();
            if (habit.records[today]) {
                delete habit.records[today];
                showToast('❌ 已取消打卡', 1200);
            } else {
                habit.records[today] = true;
                showToast('✅ 打卡成功', 1200);
            }

            saveHabits();
            renderHabits();
        }

        // ---------- 删除习惯 (带动画 & 确认) ----------
        function initiateDelete(habitId, element) {
            const habit = habits.find(h => h.id === habitId);
            if (!habit) return;

            // 显示自定义确认框
            showConfirm(`确定要删除习惯“${habit.name}”吗？所有记录将丢失。`, () => {
                // 确认后播放删除动画
                if (element) {
                    element.classList.add('remove-animation');
                    element.addEventListener('animationend', () => {
                        // 动画结束后实际删除数据并重新渲染
                        habits = habits.filter(h => h.id !== habitId);
                        saveHabits();
                        renderHabits();
                        // 如果当前热力图打开的是这个习惯，关闭模态框
                        if (modalCurrentHabitId === habitId) {
                            document.getElementById('heatmapModal').classList.remove('active');
                            modalCurrentHabitId = null;
                        }
                        showToast('习惯已删除', 1200);
                    }, { once: true });
                } else {
                    // 保底
                    habits = habits.filter(h => h.id !== habitId);
                    saveHabits();
                    renderHabits();
                    if (modalCurrentHabitId === habitId) {
                        document.getElementById('heatmapModal').classList.remove('active');
                        modalCurrentHabitId = null;
                    }
                    showToast('习惯已删除', 1200);
                }
            }, () => {
                // 取消删除，什么也不做
                showToast('已取消', 1000);
            });
        }

        // ---------- 编辑习惯名 ----------
        function editHabitName(habitId) {
            const habit = habits.find(h => h.id === habitId);
            if (!habit) return;
            const newName = prompt('修改习惯名称', habit.name);
            if (newName && newName.trim() !== '') {
                habit.name = newName.trim();
                saveHabits();
                renderHabits();
                if (modalCurrentHabitId === habitId) {
                    document.getElementById('modalHabitName').innerText = newName.trim();
                }
                showToast('名称已更新', 1200);
            }
        }

        // ---------- 热力图模态框 ----------
        function openHeatmap(habitId) {
            const habit = habits.find(h => h.id === habitId);
            if (!habit) return;

            modalCurrentHabitId = habitId;
            const now = new Date();
            modalYear = now.getFullYear();
            modalMonth = now.getMonth() + 1;

            updateModalContent(habit);
            document.getElementById('heatmapModal').classList.add('active');
        }

        function updateModalContent(habit) {
            if (!habit) return;

            document.getElementById('modalHabitName').innerText = habit.name;
            document.getElementById('modalMonthYear').innerText = `${modalYear}年${modalMonth}月`;

            const firstDay = new Date(modalYear, modalMonth - 1, 1);
            let startDayOfWeek = firstDay.getDay();
            let startOffset = startDayOfWeek === 0 ? 6 : startDayOfWeek - 1;

            const daysInMonth = new Date(modalYear, modalMonth, 0).getDate();

            let cells = [];
            for (let i = 0; i < startOffset; i++) {
                cells.push('<div class="cal-cell empty"></div>');
            }
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = formatDate(modalYear, modalMonth, d);
                const isCompleted = habit.records[dateStr] ? true : false;
                const completedClass = isCompleted ? 'completed' : '';
                cells.push(`<div class="cal-cell ${completedClass}">${d}</div>`);
            }
            while (cells.length < 42) {
                cells.push('<div class="cal-cell empty"></div>');
            }

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = `
                <div class="weekday">一</div><div class="weekday">二</div><div class="weekday">三</div><div class="weekday">四</div><div class="weekday">五</div><div class="weekday">六</div><div class="weekday">日</div>
                ${cells.join('')}
            `;

            let monthCount = 0;
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = formatDate(modalYear, modalMonth, d);
                if (habit.records[dateStr]) monthCount++;
            }
            document.getElementById('monthCount').innerText = monthCount;
            document.getElementById('totalGlobalCount').innerText = totalDays(habit.records);
        }

        function changeMonth(delta) {
            if (!modalCurrentHabitId) return;
            modalMonth += delta;
            if (modalMonth < 1) {
                modalMonth = 12;
                modalYear -= 1;
            } else if (modalMonth > 12) {
                modalMonth = 1;
                modalYear += 1;
            }
            const habit = habits.find(h => h.id === modalCurrentHabitId);
            if (habit) updateModalContent(habit);
        }

        // ---------- 事件绑定 ----------
        document.addEventListener('DOMContentLoaded', () => {
            loadHabits();
            renderHabits();

            // 添加习惯
            document.getElementById('addHabitBtn').addEventListener('click', () => {
                const input = document.getElementById('habitNameInput');
                const name = input.value.trim();
                if (name === '') {
                    showToast('请输入习惯名称', 1500);
                    return;
                }
                const newHabit = {
                    id: Date.now() + '' + Math.floor(Math.random() * 1000),
                    name: name,
                    records: {}
                };
                habits.push(newHabit);
                saveHabits();
                renderHabits(); // 重新渲染自带入场动画
                input.value = '';
                showToast('✨ 新习惯已添加', 1500);
            });

            // 委托事件
            document.getElementById('habitList').addEventListener('click', (e) => {
                const target = e.target.closest('button');
                if (!target) return;

                const habitId = target.getAttribute('data-id');
                if (!habitId) return;

                // 打卡
                if (target.classList.contains('check-btn') || target.getAttribute('data-action') === 'check') {
                    toggleHabitCheck(habitId);
                }
                // 热力图
                else if (target.classList.contains('heatmap-icon') || target.getAttribute('data-action') === 'heatmap') {
                    openHeatmap(habitId);
                }
                // 编辑
                else if (target.classList.contains('habit-edit') || target.innerText.includes('✏️')) {
                    editHabitName(habitId);
                }
                // 删除
                else if (target.classList.contains('habit-delete') || target.innerText.includes('🗑️')) {
                    // 获取卡片元素以便动画
                    const card = target.closest('.habit-card');
                    initiateDelete(habitId, card);
                }
            });

            // 热力图模态框关闭
            document.getElementById('closeModalBtn').addEventListener('click', () => {
                document.getElementById('heatmapModal').classList.remove('active');
                modalCurrentHabitId = null;
            });
            document.getElementById('heatmapModal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('heatmapModal')) {
                    document.getElementById('heatmapModal').classList.remove('active');
                    modalCurrentHabitId = null;
                }
            });

            // 月份切换
            document.getElementById('prevMonthBtn').addEventListener('click', () => changeMonth(-1));
            document.getElementById('nextMonthBtn').addEventListener('click', () => changeMonth(1));

            // 回车添加
            document.getElementById('habitNameInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    document.getElementById('addHabitBtn').click();
                }
            });
        });
    })();
</script>
</body>
</html>
