<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>极简记账本</title>
    <style>
        /* 全局样式重置+基础配置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        :root {
            /* 高级配色体系 */
            --primary: #4080ff;
            --primary-light: #e8f0ff;
            --success: #52c41a;
            --danger: #ff4d4f;
            --text-main: #1f2937;
            --text-secondary: #6b7280;
            --text-tertiary: #9ca3af;
            --bg-main: #f9fafb;
            --bg-card: #ffffff;
            --border-light: #e5e7eb;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.05);
            --radius-sm: 6px;
            --radius-md: 12px;
            --transition: all 0.2s ease;
        }
        body {
            background-color: var(--bg-main);
            padding: 16px;
            min-height: 100vh;
        }
        /* 核心容器 */
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 24px;
            box-shadow: var(--shadow-md);
        }
        /* 顶部时间栏 */
        .time-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .current-date {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .current-month {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-main);
        }
        /* 区域标题 */
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-light);
        }
        /* 表单控件 */
        .form-group {
            margin-bottom: 16px;
        }
        select, input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            font-size: 15px;
            color: var(--text-main);
            background-color: var(--bg-main);
            transition: var(--transition);
        }
        select:focus, input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-light);
        }
        select::placeholder, input::placeholder {
            color: var(--text-tertiary);
        }
        /* 按钮样式 */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 12px;
        }
        .btn-primary {
            background-color: var(--primary);
            color: white;
        }
        .btn-primary:hover {
            background-color: #3370e7;
            box-shadow: var(--shadow-sm);
        }
        .btn-danger {
            background-color: var(--danger);
            color: white;
        }
        .btn-danger:hover {
            background-color: #ff3838;
            box-shadow: var(--shadow-sm);
        }
        /* 数据展示区 */
        .data-card {
            background-color: var(--bg-main);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-top: 8px;
        }
        .data-item {
            font-size: 15px;
            line-height: 2;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .data-item:last-child {
            border-bottom: none;
        }
        .data-label {
            color: var(--text-secondary);
        }
        .data-value {
            font-weight: 500;
        }
        .balance-value {
            color: var(--success);
            font-weight: 600;
        }
        /* 隐藏音频元素 */
        .sound-element {
            display: none;
        }
        /* 响应式微调 */
        @media (max-width: 375px) {
            .container {
                padding: 18px;
            }
            .current-month {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 隐藏的音频元素（成功提示音） -->
        <audio class="sound-element" id="success-sound" preload="auto">
            <!-- 轻量的成功提示音CDN资源，时长0.3秒，无版权 -->
            <source src="https://assets.mixkit.co/sfx/preview/mixkit-select-click-1109.mp3" type="audio/mpeg">
        </audio>

        <!-- 顶部时间栏（自动识别当前时间） -->
        <div class="time-header">
            <div class="current-date" id="current-date">2026年03月03日 星期二</div>
            <div class="current-month">当前月份：<span id="current-month-text">3月</span></div>
        </div>

        <!-- 1. 月份选择区域 -->
        <div class="form-group">
            <div class="section-title">选择记账月份</div>
            <select id="month-select">
                <option value="1">1月</option>
                <option value="2">2月</option>
                <option value="3">3月</option>
                <option value="4">4月</option>
                <option value="5">5月</option>
                <option value="6">6月</option>
                <option value="7">7月</option>
                <option value="8">8月</option>
                <option value="9">9月</option>
                <option value="10">10月</option>
                <option value="11">11月</option>
                <option value="12">12月</option>
            </select>
        </div>

        <!-- 2. 逐笔收支录入区域 -->
        <div class="form-group">
            <div class="section-title">记录收支</div>
            <select id="record-type">
                <option value="">请选择记录类型</option>
                <option value="income">收入</option>
                <option value="work">工作支出</option>
                <option value="traffic">交通支出</option>
                <option value="entertainment">吃喝玩乐支出</option>
            </select>
            <input type="number" id="amount-input" placeholder="输入本次金额（元）" step="0.01" min="0">
            <button class="btn btn-primary" onclick="addRecord()">添加记录</button>
            <button class="btn btn-danger" onclick="resetMonthData()">清空当月数据</button>
        </div>

        <!-- 3. 月度数据展示区域 -->
        <div class="form-group">
            <div class="section-title">当月收支明细</div>
            <div class="data-card">
                <div class="data-item">
                    <span class="data-label">当月收入</span>
                    <span class="data-value" id="income-text">¥0.00</span>
                </div>
                <div class="data-item">
                    <span class="data-label">当月总支出</span>
                    <span class="data-value" id="total-cost-text">¥0.00</span>
                </div>
                <div class="data-item">
                    <span class="data-label">当月结余</span>
                    <span class="data-value balance-value" id="month-balance-text">¥0.00</span>
                </div>
                <div class="data-item">
                    <span class="data-label">工作支出</span>
                    <span class="data-value" id="work-text">¥0.00（0.0%）</span>
                </div>
                <div class="data-item">
                    <span class="data-label">交通支出</span>
                    <span class="data-value" id="traffic-text">¥0.00（0.0%）</span>
                </div>
                <div class="data-item">
                    <span class="data-label">吃喝玩乐支出</span>
                    <span class="data-value" id="entertainment-text">¥0.00（0.0%）</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 初始化本地存储数据
        function initData() {
            const accountData = localStorage.getItem('accountBook');
            if (!accountData) {
                const initialData = {};
                for (let i = 1; i <= 12; i++) {
                    initialData[i] = {
                        income: 0.0,
                        work: 0.0,
                        traffic: 0.0,
                        entertainment: 0.0
                    };
                }
                localStorage.setItem('accountBook', JSON.stringify(initialData));
            }
        }

        // 播放成功提示音效（封装兼容逻辑）
        function playSuccessSound() {
            try {
                const sound = document.getElementById('success-sound');
                // 重置播放位置（避免重复点击时音效不播放）
                sound.currentTime = 0;
                // 播放音效
                sound.play();
            } catch (e) {
                // 音效播放失败不影响主功能，仅打印日志
                console.log('音效播放失败:', e);
            }
        }

        // 格式化当前时间（高级时间展示）
        function formatCurrentTime() {
            const now = new Date();
            // 年份
            const year = now.getFullYear();
            // 月份（补0）
            const month = (now.getMonth() + 1).toString().padStart(2, '0');
            // 日期（补0）
            const day = now.getDate().toString().padStart(2, '0');
            // 星期
            const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const weekDay = weekDays[now.getDay()];
            // 当前月份文字
            const currentMonthText = `${now.getMonth() + 1}月`;

            // 更新页面时间展示
            document.getElementById('current-date').textContent = `${year}年${month}月${day}日 ${weekDay}`;
            document.getElementById('current-month-text').textContent = currentMonthText;

            // 自动选中当前月份
            const currentMonth = now.getMonth() + 1;
            document.getElementById('month-select').value = currentMonth;
            loadAndShowData(currentMonth);
        }

        // 加载指定月份的数据并展示
        function loadAndShowData(month) {
            if (!month) return;
            try {
                const accountData = JSON.parse(localStorage.getItem('accountBook'));
                const monthData = accountData[month];
                
                const income = parseFloat(monthData.income);
                const work = parseFloat(monthData.work);
                const traffic = parseFloat(monthData.traffic);
                const entertainment = parseFloat(monthData.entertainment);
                const totalCost = work + traffic + entertainment;
                const monthBalance = income - totalCost;

                // 计算占比（简化展示）
                const workRatio = totalCost > 0 ? (work / totalCost * 100).toFixed(1) : 0;
                const trafficRatio = totalCost > 0 ? (traffic / totalCost * 100).toFixed(1) : 0;
                const entertainmentRatio = totalCost > 0 ? (entertainment / totalCost * 100).toFixed(1) : 0;

                // 更新页面展示（精简格式）
                document.getElementById('income-text').textContent = `¥${income.toFixed(2)}`;
                document.getElementById('total-cost-text').textContent = `¥${totalCost.toFixed(2)}`;
                document.getElementById('month-balance-text').textContent = `¥${monthBalance.toFixed(2)}`;
                document.getElementById('work-text').textContent = `¥${work.toFixed(2)}（${workRatio}%）`;
                document.getElementById('traffic-text').textContent = `¥${traffic.toFixed(2)}（${trafficRatio}%）`;
                document.getElementById('entertainment-text').textContent = `¥${entertainment.toFixed(2)}（${entertainmentRatio}%）`;
            } catch (e) {
                console.log('加载数据异常:', e);
            }
        }

        // 逐笔添加记录（添加成功音效，失败无变化）
        function addRecord() {
            const month = document.getElementById('month-select').value;
            const recordType = document.getElementById('record-type').value;
            const amount = parseFloat(document.getElementById('amount-input').value || 0);

            // 校验不通过则直接返回，无任何提示/音效
            if (!month || !recordType || isNaN(amount) || amount <= 0) {
                return;
            }

            try {
                const accountData = JSON.parse(localStorage.getItem('accountBook'));
                accountData[month][recordType] += amount;
                localStorage.setItem('accountBook', JSON.stringify(accountData));

                // 清空输入框，聚焦类型选择框
                document.getElementById('amount-input').value = '';
                document.getElementById('record-type').focus();
                
                // 播放成功音效
                playSuccessSound();

                // 成功则更新数据展示
                loadAndShowData(month);
            } catch (e) {
                // 失败则无任何操作，仅打印日志（无音效、无界面变化）
                console.log('添加记录异常:', e);
            }
        }

        // 清空当月数据（移除所有弹窗提示）
        function resetMonthData() {
            const month = document.getElementById('month-select').value;
            if (!month) {
                return;
            }

            try {
                const accountData = JSON.parse(localStorage.getItem('accountBook'));
                accountData[month] = {
                    income: 0.0,
                    work: 0.0,
                    traffic: 0.0,
                    entertainment: 0.0
                };
                localStorage.setItem('accountBook', JSON.stringify(accountData));
                // 成功则更新数据展示（清空无音效）
                loadAndShowData(month);
            } catch (e) {
                // 失败则无任何操作，仅打印日志
                console.log('清空数据异常:', e);
            }
        }

        // 页面加载初始化（优化执行顺序）
        document.addEventListener('DOMContentLoaded', function() {
            initData();
            formatCurrentTime(); // 自动识别并展示当前时间
            // 监听月份选择事件
            document.getElementById('month-select').addEventListener('change', function() {
                // 切换月份时更新顶部文字
                document.getElementById('current-month-text').textContent = `${this.value}月`;
                loadAndShowData(this.value);
            });
        });
    </script>
</body>
</html>
