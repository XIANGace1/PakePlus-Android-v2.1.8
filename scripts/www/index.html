<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>一日待办 · 移动清单</title>
    <!-- Font Awesome 6 (免费) 用于清爽图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 12px 0 20px 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* 移动卡片容器 */
        .app {
            width: 100%;
            max-width: 420px;
            margin: 0 16px;
            background-color: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 35px -8px rgba(0, 10, 30, 0.15);
            overflow: hidden;
            backdrop-filter: blur(2px);
            display: flex;
            flex-direction: column;
            height: auto;
            border: 1px solid rgba(230, 240, 255, 0.5);
        }

        /* 头部 */
        .app-header {
            padding: 24px 24px 12px 24px;
            background: white;
        }

        .app-header h1 {
            font-size: 32px;
            font-weight: 650;
            letter-spacing: -0.5px;
            color: #1a2e45;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-header h1 i {
            color: #3b7cff;
            font-size: 32px;
            background: #eef4ff;
            padding: 8px;
            border-radius: 18px;
        }

        .sub-head {
            color: #68788c;
            font-size: 15px;
            font-weight: 400;
            margin-top: 4px;
            padding-left: 4px;
            letter-spacing: 0.2px;
        }

        /* 添加代办区域 */
        .add-section {
            padding: 8px 24px 18px 24px;
            background: white;
            border-bottom: 1px solid #eff3f8;
        }

        .add-form {
            display: flex;
            gap: 10px;
            align-items: center;
            background: #f8fafd;
            border-radius: 30px;
            padding: 4px 4px 4px 18px;
            border: 1px solid #e2e9f2;
            transition: border 0.15s ease;
        }

        .add-form:focus-within {
            border-color: #3b7cff;
            background: #ffffff;
            box-shadow: 0 4px 12px rgba(59, 124, 255, 0.12);
        }

        .add-form input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 14px 0;
            font-size: 16px;
            outline: none;
            color: #1a2e45;
            placeholder-color: #9aabbf;
        }

        .add-form input::placeholder {
            color: #a6b8cc;
            font-weight: 400;
        }

        .add-form button {
            background: #3b7cff;
            border: none;
            width: 52px;
            height: 52px;
            border-radius: 30px;
            color: white;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            box-shadow: 0 8px 14px -6px rgba(59, 124, 255, 0.4);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .add-form button:active {
            background: #2a5fd9;
            transform: scale(0.96);
            box-shadow: 0 4px 8px -3px rgba(59, 124, 255, 0.5);
        }

        /* 清单主体 */
        .todo-list-container {
            background: #ffffff;
            max-height: 480px;
            overflow-y: auto;
            padding: 8px 8px 8px 18px;
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 #f1f5f9;
        }

        .todo-list-container::-webkit-scrollbar {
            width: 5px;
        }

        .todo-list-container::-webkit-scrollbar-track {
            background: #f0f4fa;
        }

        .todo-list-container::-webkit-scrollbar-thumb {
            background: #b9c8dd;
            border-radius: 20px;
        }

        /* 待办项 */
        .todo-item {
            display: flex;
            align-items: center;
            padding: 12px 12px 12px 6px;
            background: white;
            border-radius: 18px;
            margin-bottom: 4px;
            transition: background 0.18s;
            user-select: none;
            cursor: pointer;
            -webkit-tap-highlight-color: rgba(59,124,255,0.1);
        }

        .todo-item:active {
            background: #f5f9ff;
        }

        /* 左侧图标区 */
        .todo-status-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            color: #3b7cff;
            font-size: 24px;
            flex-shrink: 0;
        }

        /* 已完成图标样式 */
        .todo-status-icon .fa-check-circle {
            color: #28a745;
            filter: drop-shadow(0 2px 4px rgba(40, 167, 69, 0.2));
        }

        .todo-status-icon .fa-circle {
            color: #b1c6e0;
        }

        /* 代办文本 */
        .todo-text {
            flex: 1;
            font-size: 17px;
            font-weight: 500;
            color: #1d2f44;
            line-height: 1.4;
            word-break: break-word;
            padding-right: 8px;
            transition: color 0.15s, text-decoration 0.15s;
        }

        .todo-text.completed {
            text-decoration: line-through;
            color: #8f9fb1;
            font-weight: 400;
        }

        /* 删除按钮 */
        .delete-btn {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 40px;
            background: transparent;
            color: #a1b3cc;
            font-size: 20px;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s, color 0.15s;
            border: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .delete-btn:active {
            background: #fee2e2;
            color: #e55;
        }

        .delete-btn i {
            pointer-events: none;  /* 确保点击删除按钮区域由父级处理 */
        }

        /* 空状态 */
        .empty-message {
            text-align: center;
            padding: 48px 20px;
            color: #9aafc9;
            font-size: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .empty-message i {
            font-size: 48px;
            color: #d3e0f0;
            margin-bottom: 6px;
        }

        /* 底部统计栏 */
        .stats-bar {
            padding: 16px 24px 20px 24px;
            background: white;
            border-top: 1px solid #ecf1f7;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            color: #566f8c;
            font-weight: 500;
        }

        .remaining-count {
            background: #eef4fa;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 600;
            color: #1a2e45;
        }

        .clear-btn {
            background: none;
            border: none;
            color: #8ca0bb;
            font-size: 15px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            -webkit-tap-highlight-color: transparent;
        }

        .clear-btn:active {
            background: #f0f5fe;
            color: #3b7cff;
        }

        .clear-btn i {
            font-size: 14px;
        }

        /* 辅助点击区域 */
        .todo-item * {
            pointer-events: none;  /* 让所有子元素不拦截点击，由代理统一处理 */
        }

        /* 但删除按钮本身需要可点击识别，我们恢复指针事件，配合代理逻辑 */
        .delete-btn {
            pointer-events: auto;  /* 只有删除按钮区域能触发删除分支 */
        }

        /* 为了点击切换仍然覆盖整个item，但删除按钮自己处理。其他区域指针事件为none，点击item本身仍可捕获 */
        .todo-item {
            pointer-events: auto;
        }

        /* 确保图标和文字不会阻止事件冒泡到item，而删除按钮因为pointer-events:auto会优先触发closest */
    </style>
</head>
<body>
    <div class="app">
        <div class="app-header">
            <h1>
                <i class="fas fa-clipboard-list"></i> 一日待办
            </h1>
            <div class="sub-head">前一天写好 · 第二天勾掉</div>
        </div>

        <div class="add-section">
            <div class="add-form">
                <input type="text" id="newTodoInput" placeholder="写一个代办，比如 明天开会" autocomplete="off" enterkeyhint="done">
                <button id="addTodoBtn" aria-label="添加代办"><i class="fas fa-plus"></i></button>
            </div>
        </div>

        <!-- 待办列表容器（事件代理挂载于此） -->
        <div class="todo-list-container" id="todoListContainer">
            <!-- 动态插入待办项或空状态 -->
        </div>

        <div class="stats-bar">
            <span class="remaining-count" id="remainingCount">0 项未完成</span>
            <button class="clear-btn" id="clearCompletedBtn"><i class="far fa-trash-alt"></i> 清除已完成</button>
        </div>
    </div>

    <script>
        (function() {
            // 数据存储key
            const STORAGE_KEY = 'daily_todo_app';

            // 默认代办示例 (前一天写好的感觉)
            const defaultTodos = [
                { id: Date.now() + 1, text: '买早餐食材', completed: false },
                { id: Date.now() + 2, text: '10点团队同步', completed: false },
                { id: Date.now() + 3, text: '取快递', completed: true },
                { id: Date.now() + 4, text: '给妈妈打电话', completed: false }
            ];

            // 当前待办数组
            let todos = [];

            // DOM 元素
            const todoContainer = document.getElementById('todoListContainer');
            const newInput = document.getElementById('newTodoInput');
            const addBtn = document.getElementById('addTodoBtn');
            const remainingSpan = document.getElementById('remainingCount');
            const clearCompletedBtn = document.getElementById('clearCompletedBtn');

            // ---------- 辅助函数 ----------
            // 加载本地数据
            function loadFromStorage() {
                try {
                    const stored = localStorage.getItem(STORAGE_KEY);
                    if (stored) {
                        const parsed = JSON.parse(stored);
                        // 简单校验：必须是数组
                        if (Array.isArray(parsed)) {
                            todos = parsed;
                            return;
                        }
                    }
                    // 无数据或无效则使用默认
                    todos = defaultTodos.map(t => ({ ...t, id: Date.now() + Math.random() * 10000 })); // 保证id新鲜
                } catch (e) {
                    console.warn('读取存储失败，使用默认待办');
                    todos = defaultTodos;
                }
            }

            // 保存到本地
            function saveToStorage() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
            }

            // 更新剩余数量显示
            function updateRemaining() {
                const remaining = todos.filter(t => !t.completed).length;
                remainingSpan.textContent = remaining + ' 项未完成';
            }

            // 渲染待办列表 (使用 DOM 元素构建，避免 XSS)
            function renderTodos() {
                // 清空容器
                while (todoContainer.firstChild) {
                    todoContainer.removeChild(todoContainer.firstChild);
                }

                if (!todos || todos.length === 0) {
                    // 显示空状态
                    const emptyDiv = document.createElement('div');
                    emptyDiv.className = 'empty-message';
                    emptyDiv.innerHTML = '<i class="far fa-smile-wink"></i> 没有待办，放松一下吧～';
                    todoContainer.appendChild(emptyDiv);
                } else {
                    // 按原始顺序渲染 (id 插入顺序)
                    todos.forEach(todo => {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'todo-item';
                        itemDiv.dataset.id = todo.id;  // 存储id

                        // 左侧状态图标
                        const statusIcon = document.createElement('span');
                        statusIcon.className = 'todo-status-icon';
                        const icon = document.createElement('i');
                        // 根据完成状态设置不同图标
                        if (todo.completed) {
                            icon.className = 'fas fa-check-circle';
                        } else {
                            icon.className = 'far fa-circle';
                        }
                        statusIcon.appendChild(icon);

                        // 中间文本
                        const textSpan = document.createElement('span');
                        textSpan.className = 'todo-text' + (todo.completed ? ' completed' : '');
                        textSpan.textContent = todo.text;   // 使用textContent防XSS

                        // 右侧删除按钮
                        const deleteSpan = document.createElement('span');
                        deleteSpan.className = 'delete-btn';
                        deleteSpan.setAttribute('aria-label', '删除代办');
                        const deleteIcon = document.createElement('i');
                        deleteIcon.className = 'fas fa-trash-alt';
                        deleteSpan.appendChild(deleteIcon);

                        // 组装
                        itemDiv.appendChild(statusIcon);
                        itemDiv.appendChild(textSpan);
                        itemDiv.appendChild(deleteSpan);

                        todoContainer.appendChild(itemDiv);
                    });
                }

                // 更新底部计数
                updateRemaining();
            }

            // 保存并刷新UI
            function saveAndRender() {
                saveToStorage();
                renderTodos();
            }

            // ---------- 核心操作 ----------
            // 添加新待办
            function addNewTodo() {
                const text = newInput.value.trim();
                if (text === '') {
                    // 轻提醒：让输入框闪烁一下
                    newInput.style.borderColor = '#ff9f9f';
                    setTimeout(() => {
                        newInput.style.borderColor = '';
                    }, 200);
                    return;
                }

                // 创建新待办 (id 用时间戳+随机数确保唯一)
                const newTodo = {
                    id: Date.now() + Math.random() * 100000,
                    text: text,
                    completed: false
                };

                todos.push(newTodo);      // 加在底部，符合自然顺序
                saveAndRender();

                // 清空输入并保持聚焦
                newInput.value = '';
                newInput.focus();
            }

            // 切换完成状态 (通过id)
            function toggleTodo(id) {
                const todo = todos.find(t => t.id == id);  // 宽松比较因为dataset.id是字符串
                if (todo) {
                    todo.completed = !todo.completed;
                    saveAndRender();
                }
            }

            // 删除待办
            function deleteTodo(id) {
                todos = todos.filter(t => t.id != id);  // 保留不相等id的项
                saveAndRender();
            }

            // 清除所有已完成
            function clearCompleted() {
                const hasCompleted = todos.some(t => t.completed);
                if (!hasCompleted) return;  // 没有已完成就不操作
                todos = todos.filter(t => !t.completed);
                saveAndRender();
            }

            // ---------- 事件绑定 ----------
            // 1. 添加按钮点击
            addBtn.addEventListener('click', function(e) {
                e.preventDefault(); // 防止任何奇怪提交
                addNewTodo();
            });

            // 2. 输入框回车
            newInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addNewTodo();
                }
            });

            // 3. 事件代理：监听整个待办容器 (处理切换和删除)
            todoContainer.addEventListener('click', function(e) {
                // 优先判断是否点击在删除按钮上 (利用 closest)
                const deleteBtn = e.target.closest('.delete-btn');
                if (deleteBtn) {
                    // 获取待办项父级 (todo-item)
                    const item = deleteBtn.closest('.todo-item');
                    if (item && item.dataset.id) {
                        e.stopPropagation();  // 避免可能冒泡到外层
                        deleteTodo(item.dataset.id);
                    }
                    return;
                }

                // 如果不是删除按钮，再判断点击是否在某个待办项上（实现切换）
                const todoItem = e.target.closest('.todo-item');
                if (todoItem && todoItem.dataset.id) {
                    toggleTodo(todoItem.dataset.id);
                }
                // 点击空白区域（空状态）什么也不做
            });

            // 4. 清除已完成按钮
            clearCompletedBtn.addEventListener('click', function() {
                clearCompleted();
            });

            // 触摸优化: 防止长按菜单弹出 (无伤大雅)
            todoContainer.addEventListener('contextmenu', (e) => e.preventDefault());

            // ---------- 初始化 ----------
            loadFromStorage();
            renderTodos();

            // 页面卸载前无需额外操作（localStorage已保存）
            // 可选：窗口隐藏时保存（但每次修改已保存）
            window.addEventListener('beforeunload', function() {
                saveToStorage(); // 冗余保险
            });

            // 输入框自动获取焦点 (移动端自动弹出键盘取决于用户，不强制)
            // 添加个小延迟聚焦提高体验 (但避免遮挡，视情况)
            setTimeout(() => newInput.focus(), 300);
        })();
    </script>
</body>
</html>
